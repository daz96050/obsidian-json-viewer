<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">JSON Viewer for Obsidian</title>
  <desc id="desc">A read-only JSON and JSONL viewer for Obsidian with search, outline navigation, record parsing, and syntax-highlighted source.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#20221f"/>
      <stop offset="1" stop-color="#141715"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect x="72" y="72" width="1456" height="576" rx="30" fill="#242720" stroke="#3f4639" filter="url(#shadow)"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="128" y="166" fill="#f2ecd2" font-size="58" font-weight="800">JSON Viewer</text>
    <text x="128" y="218" fill="#b7b099" font-size="26">Read-only JSON and JSONL browsing for Obsidian</text>
    <text x="128" y="276" fill="#8f8b76" font-size="22">Tree view, JSON Pointer paths, JSONL record parsing, outline navigation, and syntax-highlighted source.</text>

    <rect x="128" y="324" width="152" height="42" rx="10" fill="#344235" stroke="#506a4e"/>
    <text x="153" y="352" fill="#8bf39c" font-size="18" font-weight="700">Read-only</text>
    <rect x="298" y="324" width="164" height="42" rx="10" fill="#2c3740" stroke="#49606f"/>
    <text x="323" y="352" fill="#8fd2ff" font-size="18" font-weight="700">JSONL</text>
    <rect x="480" y="324" width="186" height="42" rx="10" fill="#3b2f3a" stroke="#684d67"/>
    <text x="505" y="352" fill="#ff93d0" font-size="18" font-weight="700">JSON Pointer</text>
  </g>

  <g transform="translate(874 128)">
    <rect width="520" height="464" rx="18" fill="#1b1e1a" stroke="#41483c"/>
    <rect x="0" y="0" width="520" height="62" rx="18" fill="#252923"/>
    <rect x="0" y="44" width="520" height="18" fill="#252923"/>
    <text x="28" y="39" fill="#f2ecd2" font-family="Inter, ui-sans-serif, system-ui" font-size="23" font-weight="750">events.jsonl</text>
    <rect x="324" y="16" width="150" height="30" rx="8" fill="#181b17" stroke="#41483c"/>
    <text x="356" y="37" fill="#8f8b76" font-family="Inter, ui-sans-serif, system-ui" font-size="15">Filter</text>

    <g font-family="Menlo, Consolas, ui-monospace, monospace" font-size="18">
      <line x1="48" y1="104" x2="48" y2="410" stroke="#3c4438"/>
      <line x1="78" y1="178" x2="78" y2="332" stroke="#3c4438"/>
      <text x="48" y="102" fill="#ff4f9a">line 1</text>
      <rect x="126" y="84" width="70" height="24" rx="5" fill="#283a2d"/>
      <text x="136" y="102" fill="#39d98a" font-size="14">object</text>
      <text x="208" y="102" fill="#aaa38a" font-size="15">4 keys</text>

      <text x="72" y="146" fill="#ff4f9a">id</text>
      <rect x="106" y="128" width="68" height="24" rx="5" fill="#283a2d"/>
      <text x="116" y="146" fill="#39d98a" font-size="14">string</text>
      <text x="188" y="146" fill="#e6d85c">"evt_001"</text>

      <text x="72" y="190" fill="#ff4f9a">duration</text>
      <rect x="170" y="172" width="70" height="24" rx="5" fill="#263948"/>
      <text x="180" y="190" fill="#64b5f6" font-size="14">number</text>
      <text x="254" y="190" fill="#59c8ff">142</text>

      <text x="72" y="234" fill="#ff4f9a">success</text>
      <rect x="162" y="216" width="76" height="24" rx="5" fill="#3a3329"/>
      <text x="172" y="234" fill="#ffad4d" font-size="14">boolean</text>
      <text x="252" y="234" fill="#ffad4d">true</text>

      <text x="72" y="292" fill="#ff4f9a">payload</text>
      <rect x="158" y="274" width="70" height="24" rx="5" fill="#283a2d"/>
      <text x="168" y="292" fill="#39d98a" font-size="14">object</text>
      <text x="240" y="292" fill="#aaa38a" font-size="15">3 keys</text>

      <text x="102" y="336" fill="#ff4f9a">tags</text>
      <rect x="156" y="318" width="56" height="24" rx="5" fill="#263948"/>
      <text x="166" y="336" fill="#64b5f6" font-size="14">array</text>
      <text x="226" y="336" fill="#aaa38a" font-size="15">2 items</text>
    </g>

    <line x1="382" y1="86" x2="382" y2="428" stroke="#41483c"/>
    <text x="404" y="108" fill="#aaa38a" font-family="Inter, ui-sans-serif, system-ui" font-size="13" font-weight="800">OUTLINE</text>
    <g font-family="Menlo, Consolas, ui-monospace, monospace" font-size="15">
      <rect x="404" y="128" width="88" height="26" rx="5" fill="#363a34"/>
      <text x="414" y="146" fill="#f2ecd2">line 1</text>
      <text x="476" y="146" fill="#aaa38a">4</text>
      <rect x="404" y="162" width="88" height="26" rx="5" fill="#30342f"/>
      <text x="424" y="180" fill="#f2ecd2">payload</text>
      <text x="476" y="180" fill="#aaa38a">3</text>
      <rect x="404" y="196" width="88" height="26" rx="5" fill="#30342f"/>
      <text x="438" y="214" fill="#aaa38a">tags</text>
      <text x="476" y="214" fill="#aaa38a">2</text>
      <rect x="404" y="230" width="88" height="26" rx="5" fill="#30342f"/>
      <text x="414" y="248" fill="#f2ecd2">line 2</text>
      <text x="476" y="248" fill="#aaa38a">4</text>
    </g>
  </g>
</svg>
